name: Build Crowi Browser

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Mozilla build type
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
      - '*-release'

jobs:
  linux-build:
    name: Build Linux artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 1800
    env:
      MOZ_AUTOMATION: 1
      MOZ_NOSPAM: 1
      MACH_BUILD_PYTHON: python3
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mozilla build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates \
            python3 python3-pip python3-venv \
            ninja-build pkg-config zlib1g-dev \
            libssl-dev libffi-dev libbz2-dev \
            libxml2-dev libx11-dev libxrandr-dev \
            libxt-dev libgtk-3-dev libdbus-1-dev \
            libpulse-dev libasound2-dev \
            ccache unzip wget python3-zstandard

      - name: Bootstrap Firefox build environment
        shell: bash
        run: |
          ./mach bootstrap

      - name: Install zstandard in Mozilla build Python
        shell: bash
        run: |
          ./mach python -m pip install zstandard

      - name: Build Crowi Browser
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "debug" ]; then
            ./mach build --verbose --debug
          else
            ./mach build --verbose
          fi

      - name: Package artifact
        shell: bash
        run: |
          ./mach package

      - name: Collect build artifacts
        shell: bash
        run: |
          echo "Searching for generated packages..."
          find . -type f \( -name "*.tar.*" -o -name "*.zip" -o -name "*.dmg" -o -name "*.apk" -o -name "*.exe" \) | head -200

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: crowi-linux-build-${{ github.run_number }}
          path: |
            ./**/dist/*
            ./**/obj*/dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./**/dist/*
            ./**/obj*/dist/*
