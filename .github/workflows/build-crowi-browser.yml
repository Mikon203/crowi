name: Build Crowi Browser

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Mozilla build type
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
      - '*-release'

permissions:
  contents: write

jobs:
  linux-build:
    name: Build Linux artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZ_NOSPAM: 1
      CI: true
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify branding directory
        run: |
          if [ ! -d browser/branding/crowi ]; then
            echo "ERROR: browser/branding/crowi not found"
            ls browser/branding
            exit 1
          fi
          ls -la browser/branding/crowi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl ca-certificates python3 python3-pip python3-venv ninja-build pkg-config zlib1g-dev libssl-dev libffi-dev libbz2-dev libxml2-dev libx11-dev libxrandr-dev libxt-dev libgtk-3-dev libdbus-1-dev libpulse-dev libasound2-dev ccache unzip wget

      - name: Cache toolchains and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.cache/ccache
          key: crowi-linux-${{ env.BUILD_TYPE }}-${{ github.run_id }}
          restore-keys: |
            crowi-linux-${{ env.BUILD_TYPE }}-

      - name: Write mozconfig
        run: |
          {
            echo 'ac_add_options --enable-application=browser'
            echo 'ac_add_options --with-branding=browser/branding/crowi'
            echo 'ac_add_options --with-app-name=crowi'
            echo 'ac_add_options --with-app-basename=Crowi'
            echo 'ac_add_options --with-ccache'
            echo 'mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-crowi'
            if [ "$BUILD_TYPE" = "debug" ]; then
              echo 'ac_add_options --enable-debug'
              echo 'ac_add_options --disable-optimize'
            else
              echo 'ac_add_options --disable-debug'
              echo 'ac_add_options --enable-optimize'
              echo 'ac_add_options --disable-tests'
            fi
          } > "$GITHUB_WORKSPACE/mozconfig"
          echo "MOZCONFIG=$GITHUB_WORKSPACE/mozconfig" >> "$GITHUB_ENV"
          cat "$GITHUB_WORKSPACE/mozconfig"

      - name: Bootstrap build environment
        run: ./mach --no-interactive bootstrap --application-choice=browser

      - name: Build Crowi Browser
        run: |
          ccache -M 10G
          ./mach build

      - name: Package
        run: ./mach package

      - name: Collect artifact
        run: |
          mkdir -p dist-out
          cp obj-crowi/dist/*.tar.* dist-out/
          ls -lh dist-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowi-browser-linux-${{ env.BUILD_TYPE }}
          path: dist-out/*
          retention-days: 14

  windows-build:
    name: Build Windows artifact (cross-compiled)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZ_NOSPAM: 1
      CI: true
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify branding directory
        run: |
          if [ ! -d browser/branding/crowi ]; then
            echo "ERROR: browser/branding/crowi not found"
            ls browser/branding
            exit 1
          fi
          ls -la browser/branding/crowi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl ca-certificates python3 python3-pip python3-venv ninja-build pkg-config zlib1g-dev libssl-dev libffi-dev libbz2-dev libxml2-dev libx11-dev libxrandr-dev libxt-dev libgtk-3-dev libdbus-1-dev libpulse-dev libasound2-dev ccache unzip wget msitools zip

      - name: Cache toolchains and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.cache/ccache
          key: crowi-win64-${{ env.BUILD_TYPE }}-${{ github.run_id }}
          restore-keys: |
            crowi-win64-${{ env.BUILD_TYPE }}-

      - name: Write mozconfig
        run: |
          {
            echo 'ac_add_options --enable-application=browser'
            echo 'ac_add_options --target=x86_64-pc-windows-msvc'
            echo 'ac_add_options --enable-bootstrap'
            echo 'ac_add_options --with-branding=browser/branding/crowi'
            echo 'ac_add_options --with-app-name=crowi'
            echo 'ac_add_options --with-app-basename=Crowi'
            echo 'ac_add_options --with-ccache'
            echo 'mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-crowi-win'
            if [ "$BUILD_TYPE" = "debug" ]; then
              echo 'ac_add_options --enable-debug'
              echo 'ac_add_options --disable-optimize'
            else
              echo 'ac_add_options --disable-debug'
              echo 'ac_add_options --enable-optimize'
              echo 'ac_add_options --disable-tests'
            fi
          } > "$GITHUB_WORKSPACE/mozconfig.win64"
          echo "MOZCONFIG=$GITHUB_WORKSPACE/mozconfig.win64" >> "$GITHUB_ENV"
          cat "$GITHUB_WORKSPACE/mozconfig.win64"

      - name: Bootstrap build environment
        run: |
          ./mach --no-interactive bootstrap --application-choice=browser
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust Windows target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-pc-windows-msvc

      - name: Build Crowi Browser for Windows
        run: |
          ccache -M 10G
          ./mach build

      - name: Package
        run: ./mach package

      - name: Collect artifact
        run: |
          mkdir -p dist-out
          cp obj-crowi-win/dist/*.zip dist-out/
          ls -lh dist-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowi-browser-windows-${{ env.BUILD_TYPE }}
          path: dist-out/*
          retention-days: 14

  release:
    name: Publish release
    needs: [linux-build, windows-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -lh release-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
